<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#110E1F" />
    <!-- Inter + Nunito, SELF-HOSTED (owner, 2026-10-06): the two preconnects and the Google
         stylesheet that stood here made every page load reach Google's font hosts —
         the one third-party request left in the entry. The files now live in public/fonts/ and
         /fonts/fonts.css serves them from this origin, so the network tab shows no Google host
         at all. Nunito joined the sheet 2026-10-07 — the owner's chat face ("Arial or rounded
         fonts -> becomes Nunito... Use our fonts only - no API calls"), and the sheet was
         renamed inter.css -> fonts.css with it. The face carries the full 100–900 range (the
         design previews need weights outside the app's three); the narrowing to the house
         weights is enforced by the app's own styles. Owner, 2026-09-18, unchanged: "All fonts
         should be medium weight. Inter has medium, and it has semi bold, and it has bold.
         Those are the only three I use." -->
    <!-- THE PRELOAD IS GONE (owner, 2026-10-06, late: *"I don't want preloading fonts that is
         slowing down the load."* — and the browser warned on every navigation that the preloaded
         face went unused within its window). The stylesheet loads the face when the styles that
         need it arrive; nothing is warmed ahead of being needed. -->
    <link rel="stylesheet" href="/fonts/fonts.css">
    <title>Raibach — Interactive Design Systems</title>
    <!--
      NO ACCESS CODE LIVES IN THIS FILE (2026-10-22).

      The static gate card and its React counterpart were removed on 2026-10-21: this is a local
      studio serving its own rooms, and a door whose key is no longer minted is a blank screen,
      not a door. Access is by request; neither this document nor the bundle carries a pin, and
      no document in the repository repeats one.
    -->
    <style>
      html, body { margin: 0; background: #110E1F; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
