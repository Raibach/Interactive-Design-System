# ── THE DESIGN SYSTEM STACK on raibach-cloud-3 — server variant ─────────────
# Lives on the box at /opt/raibach/ids/. This repo copy is THE source of truth.
#
# Serves: design.system.raibach.net (via the wp stack's caddy, on the shared
# docker network wp-sites_default — this file's `shared` network, external).
# Services here never publish host ports; the door is caddy's.
#
# House rules (same as the wp stack):
#   - restart: "no" — a broken boot leaves the door BLACK, loudly
#   - no fallbacks; a missing value fails the boot
#
# Secrets: /opt/raibach/ids/.env (600, from governance/ids-box.env in the repo,
# gitignored) + /opt/raibach/ids/studio.env (600, from governance/ids-studio.env).
# The .env file also feeds ${..} interpolation below.
#
# Bring up (on the box):
#   cd /opt/raibach/ids
#   docker compose up -d postgres clickhouse minio redis
#   docker compose up -d langfuse-web langfuse-worker
#   docker compose up -d frame-proxy studio-postgres studio
name: ids

services:
  # ── the studio's own database ────────────────────────────────────────────
  studio-postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: ${STUDIO_DB_PASSWORD}
      POSTGRES_DB: studio
      TZ: UTC
    volumes:
      - ./data/studio-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio"]
      interval: 3s
      timeout: 3s
      retries: 12
    restart: "no"

  # ── the design system itself (rooms app: backend + built frontend) ───────
  studio:
    build: ./studio
    env_file:
      - ./studio.env
    depends_on:
      studio-postgres:
        condition: service_healthy
    volumes:
      # the embedded vector store lives here; milvus-lite creates its file on
      # first use if absent (degraded-but-honest until then, same as local).
      - ./vector:/app/vector
    networks:
      default: {}
      shared:
        aliases: [studio]
    restart: "no"

  # ── the governance stack (langfuse) ──────────────────────────────────────
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      TZ: UTC
    volumes:
      - ./data/langfuse-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 12
    restart: "no"

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.12
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - ./data/clickhouse:/var/lib/clickhouse
      - ./data/clickhouse-logs:/var/log/clickhouse-server
      # TELEMETRY REMOVED ENTIRELY (2026-10-14, removal 2026-10-15). Without this file,
      # ClickHouse's own metric_log grew to ~194k rows in hundreds of tiny parts and a
      # single background merge ballooned to 6.4 GB RAM — it fed the OOM killer that
      # evicted the WordPress databases. Row CAPS were then tried and measured NOT
      # holding (box trace_log reached 288M rows / 4.67 GiB under a 100k-row cap); the
      # file now REMOVES the chatty logs outright — metric_log, trace_log, text_log,
      # part_log, asynchronous_metric_log, processors_profile_log, opentelemetry_span_log
      # (error_log + query_log stay). config.d is read at startup — recreate the
      # service after editing the file.
      - ./clickhouse-config/telemetry-limits.xml:/etc/clickhouse-server/config.d/telemetry-limits.xml:ro
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s
    restart: "no"

  minio:
    image: cgr.dev/chainguard/minio
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s
    restart: "no"

  redis:
    image: docker.io/redis:7
    command: >
      --requirepass ${REDIS_AUTH}
      --maxmemory-policy noeviction
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10
    restart: "no"

  langfuse-web:
    build:
      context: ./langfuse
      dockerfile: web/Dockerfile
      args:
        # THE DOOR: the base path is a BUILD-time value for Next.js (it must be
        # baked). The runtime overlay below repeats it so both agree.
        NEXT_PUBLIC_BASE_PATH: /governance
    env_file:
      - .env
    environment:
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXT_PUBLIC_BASE_PATH: /governance
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: "no"

  langfuse-worker:
    build:
      context: ./langfuse
      dockerfile: worker/Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: "no"

  # ── THE DOOR between the studio and langfuse (framing + session) ─────────
  frame-proxy:
    build: ./frame-proxy
    environment:
      RAIBACH_SESSION_COOKIE: ${RAIBACH_SESSION_COOKIE}
      STUDIO_ORIGIN: ${STUDIO_ORIGIN}
      LANGFUSE_WEB_UPSTREAM: langfuse-web:3000
    depends_on:
      - langfuse-web
    networks:
      default: {}
      shared:
        aliases: [frame-proxy]
    restart: "no"

  # ── THE BUILDER (Product room) — added 2026-10-11 ────────────────────────
  # One shared source tree, two services (the same shape HOST-THE-TOOLS.md
  # prescribes). The engine is the identical server.mjs the Mac runs;
  # PUBLIC_BASE_URL makes its preview URLs the door's /preview/<id>/ path form
  # (caddy routes it). The builder UI is served under its built-in /builder
  # basePath; its VCAAS_BASE_URL speaks to the engine on the compose network —
  # at BUILD time (the lockdown guard refuses a missing value during
  # `next build`) and at run time, same value, declared here twice on purpose.
  builder-engine:
    build:
      context: ./builder
      dockerfile: local-vcaas/Dockerfile
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: deepseek-flash
      PUBLIC_BASE_URL: https://design.system.raibach.net
    volumes:
      - ./data/builder-engine:/app/local-vcaas/data
    networks:
      default: {}
      shared:
        aliases: [builder-engine]
    restart: "no"

  builder:
    build:
      context: ./builder
      dockerfile: Dockerfile
      args:
        VCAAS_BASE_URL: http://builder-engine:4000/api/v1/vcaas
    environment:
      VCAAS_BASE_URL: http://builder-engine:4000/api/v1/vcaas
    networks:
      default: {}
      shared:
        aliases: [builder]
    restart: "no"

networks:
  default: {}
  shared:
    external: true
    name: wp-sites_default
