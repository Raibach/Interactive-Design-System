<!-- The chat's mark — replaces the Copilot logo (owner, 2026-10-06).
     Four-point spark, gradient sweep: magenta-red top · blue right · green bottom · orange left. -->
<svg xmlns="http://www.w3.org/2000/svg" width="66" height="66" viewBox="0 0 64 64" fill="none">
  <defs>
    <clipPath id="spark">
      <path d="M32 2C34 16.5 47.5 30 62 32C47.5 34 34 47.5 32 62C30 47.5 16.5 34 2 32C16.5 30 30 16.5 32 2Z"/>
    </clipPath>
    <linearGradient id="spark-v" x1="32" y1="2" x2="32" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF2E63"/>
      <stop offset="1" stop-color="#2ECF7F"/>
    </linearGradient>
    <linearGradient id="spark-h" x1="2" y1="32" x2="62" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFAE1F"/>
      <stop offset="1" stop-color="#2E7CF6"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#spark)">
    <rect width="64" height="64" fill="url(#spark-v)"/>
    <rect width="64" height="64" fill="url(#spark-h)" style="mix-blend-mode:screen"/>
  </g>
</svg>
