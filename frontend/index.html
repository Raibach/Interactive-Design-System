<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#110E1F" />
    <!-- Inter + Nunito, SELF-HOSTED (owner, 2026-10-06): the two preconnects and the Google
         stylesheet that stood here made every page load reach Google's font hosts —
         the one third-party request left in the entry. The files now live in public/fonts/ and
         /fonts/fonts.css serves them from this origin, so the network tab shows no Google host
         at all. Nunito joined the sheet 2026-10-07 — the owner's chat face ("Arial or rounded
         fonts -> becomes Nunito... Use our fonts only - no API calls"), and the sheet was
         renamed inter.css -> fonts.css with it. The face carries the full 100–900 range (the
         design previews need weights outside the app's three); the narrowing to the house
         weights is enforced by the app's own styles. Owner, 2026-09-18, unchanged: "All fonts
         should be medium weight. Inter has medium, and it has semi bold, and it has bold.
         Those are the only three I use." -->
    <!-- THE PRELOAD IS GONE (owner, 2026-10-06, late: *"I don't want preloading fonts that is
         slowing down the load."* — and the browser warned on every navigation that the preloaded
         face went unused within its window). The stylesheet loads the face when the styles that
         need it arrive; nothing is warmed ahead of being needed. -->
    <link rel="stylesheet" href="/fonts/fonts.css">
    <title>Raibach — Interactive Design Systems</title>
    <!--
      ── THE GATE IS REAL, AND IT IS HERE ───────────────────────────────────────────────────
      Owner, 2026-10-02: "it looks like … a fake login that no one can enter and then suddenly a
      real login appears" — and that is exactly what this was: a drawn form whose fields were
      dead until the React bundle arrived seconds later. A gate nobody can type into is worse
      than no gate. So the static card IS the login now:

        · the SAME pair PinGate.tsx checks (`dev@local` / Request pin access), the SAME three localStorage
          keys it writes — this script and that component are two doors, one lock;
        · it works before any bundle exists, with the logo inline (7.5 KB) and no other request;
        · a signed-in visitor (the flag is already set) sees the preparing card instead of the
          form, which is also the state after a successful submit while the page reloads;
        · React's PinGate remains the fallback (see main.tsx: the static gate is not removed
          while unauthenticated, so a working form is never replaced by a hidden one).

      MEASURED EARLIER, KEPT AS HISTORY: before this card existed the page was white for ~3 s
      (vendor JS 1.25 MB / 2.8 s, index JS 984 KB / 1.3 s) and the gate could not draw at all.
    -->
    <style>
      html, body { margin: 0; background: #110E1F; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
