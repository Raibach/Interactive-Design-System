<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1625" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Inter, in the three weights this app has: 500 (the base), 600 and 700. The range is
         narrowed to them rather than "300..900", so a stray request for a lighter or heavier
         weight can only land on the nearest of the three — the floor is enforced by the font
         itself, not by discipline. Owner, 2026-09-18: "All fonts should be medium weight. Inter
         has medium, and it has semi bold, and it has bold. Those are the only three I use." -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500..700&display=swap" rel="stylesheet">
    <title>Raibach — Interactive Design</title>
    <!--
      ── THE GATE, BEFORE THE BUNDLE ────────────────────────────────────────────────────────
      Owner, 2026-10-02: "that gate image should pop up immediately … I saw a huge white
      screen." Measured against the deployed service the same day: vendor JS 1.25 MB (2.8 s)
      and index JS 984 KB (1.3 s), so the React gate could not draw until ~3 s after the
      document arrived — and until then the page was white, because #root was empty.

      This block is that same gate as STATIC markup: no JS, no request beyond the document
      itself (the logo rides inline as a data URI — the file is 7.5 KB). It is drawn by the
      first paint and stays until React commits; main.tsx removes it one frame after render,
      and the background behind it is the same #1a1625, so the swap cannot flash white.

      IT MIRRORS PinGate.tsx — colours, sizes, weights and the fixed `dev@local` are copied
      from there. If that component's look changes, this twin changes with it. The fields are
      divs on purpose: typing into a not-yet-live input does nothing, and the real focused
      input arrives with the bundle seconds later; "Preparing…" is what says so.
    -->
    <style>
      html, body { margin: 0; background: #1a1625; }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #1a1625;
        font-family: 'Inter', system-ui, sans-serif;
      }
      #splash .splash-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 380px;
        box-sizing: border-box;
        background: #231f2e;
        border-radius: 16px;
        padding: 48px 40px 44px;
        box-shadow: 0 32px 80px rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.06);
      }
      #splash .splash-logo {
        width: 72px;
        height: 72px;
        border-radius: 14px;
        overflow: hidden;
        margin-bottom: 28px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      }
      #splash .splash-logo img { display: block; width: 100%; height: 100%; object-fit: cover; }
      #splash .splash-name {
        font-weight: 900;
        font-size: 32px;
        letter-spacing: -0.02em;
        color: #f5f0e8;
        line-height: 1;
      }
      #splash .splash-sub { font-weight: 500; font-size: 14px; color: rgba(245, 240, 232, 0.35); margin-top: 4px; }
      #splash .splash-tag { font-size: 13px; color: rgba(245, 240, 232, 0.55); margin-top: 6px; }
      #splash .splash-rule {
        width: 40px;
        height: 2px;
        border-radius: 2px;
        margin: 20px 0;
        background: linear-gradient(-90deg, rgb(240, 179, 35), rgb(254, 209, 65));
      }
      #splash .splash-field {
        width: 100%;
        box-sizing: border-box;
        height: 48px;
        padding: 0 14px;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        font-size: 14px;
        color: #f5f0e8;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
      }
      #splash .splash-placeholder { color: rgba(245, 240, 232, 0.35); }
      #splash .splash-button {
        width: 100%;
        height: 46px;
        margin-top: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 14px;
        color: #1a1625;
        background: linear-gradient(-90deg, rgb(240, 179, 35), rgb(254, 209, 65));
        border-radius: 10px;
      }
      #splash .splash-preparing { margin-top: 14px; font-size: 12px; color: rgba(245, 240, 232, 0.35); }
    </style>
  </head>
